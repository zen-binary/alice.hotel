app.front-end-client-base-url=
app.front-end-admin-base-url=

spring.application.name=alice-hotel
server.servlet.context-path=/api/v1
spring.profiles.active=prod

# Dev tool
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-exclude=static/**
spring.devtools.livereload.enabled=false

# Database configuration (MySQL) — Alice Hotel
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
## Run: src/main/resources/db/alice_hotel_init.sql then alice_hotel_booking_schema.sql
## VNPay sandbox (demo — replace for real merchant)
alice.vnpay.tmn-code=ALICEDEMO
alice.vnpay.hash-secret=ALICESECRET
alice.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
alice.vnpay.return-url=http://localhost:5173/payment/return
alice.mail.from=noreply@alice.hotel
spring.datasource.url=jdbc:mysql://localhost:3306/alice_hotel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456

## DB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.poolName=Hikari
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis / SSO temporarily disabled — re-enable with profile "redis" and remove excludes below
#spring.data.redis.host=localhost
spring.data.redis.host=127.0.0.1
# Redis server port
spring.data.redis.port=6379
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# Spring Session configuration (in-memory HttpSession while Redis is off)
#spring.session.store-type=jdbc
spring.session.store-type=none
spring.session.jdbc.initialize-schema=always

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# application.properties
upload.path=/tmp/upload
download.path=/tmp/directory/download

